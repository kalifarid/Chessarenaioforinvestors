
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ChessArena.io — Global Chess & P2P Competition Platform. Official project presentation.">
<meta name="theme-color" content="#080b0a">
<title>ChessArena.io — Global Chess Platform</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#080b0a;
  --surface:#101512;
  --surface2:#151d18;
  --green:#b7f36b;
  --green2:#83c94c;
  --white:#f3f6f1;
  --muted:#929d94;
  --border:rgba(183,243,107,.14);
  --max:1180px;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; scroll-padding-top:90px; }

body {
  background:var(--bg);
  color:var(--white);
  font-family:Inter,sans-serif;
  line-height:1.7;
  overflow-x:hidden;
}

body[dir="rtl"] {
  text-align:right;
}

a { color:inherit; text-decoration:none; }

button, input { font:inherit; }

.container {
  width:min(var(--max),91%);
  margin:auto;
}

.progress {
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0;
  background:var(--green);
  z-index:300;
}

nav {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:200;
  background:rgba(8,11,10,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.nav-inner {
  width:min(var(--max),91%);
  min-height:76px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo {
  font-family:"Space Grotesk",sans-serif;
  font-size:22px;
  font-weight:800;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span { color:var(--green); }

.nav-links {
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-links a {
  color:var(--muted);
  font-size:11px;
  transition:.2s;
  white-space:nowrap;
}

.nav-links a:hover { color:var(--green); }

.nav-right {
  display:flex;
  align-items:center;
  gap:12px;
}

.language-select {
  background:#111713;
  color:var(--white);
  border:1px solid var(--border);
  border-radius:7px;
  padding:10px 12px;
  outline:none;
  cursor:pointer;
  font-size:11px;
  max-width:145px;
}

.language-select:focus { border-color:var(--green); }

.nav-button {
  padding:11px 16px;
  background:var(--green);
  color:#10150c;
  border-radius:7px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.mobile-menu {
  display:none;
  background:none;
  border:1px solid var(--border);
  color:var(--green);
  border-radius:7px;
  padding:8px 12px;
  cursor:pointer;
}

.hero {
  min-height:750px;
  padding:155px 0 85px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.hero::before {
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  background:radial-gradient(circle,rgba(151,220,84,.13),transparent 68%);
  top:10px;
  right:-200px;
  pointer-events:none;
}

body[dir="rtl"] .hero::before {
  right:auto;
  left:-200px;
}

.hero-grid {
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:60px;
  align-items:center;
}

.eyebrow,.section-label {
  color:var(--green);
  font-size:10px;
  font-weight:800;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin-bottom:20px;
}

h1 {
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(50px,7vw,88px);
  line-height:1.04;
  letter-spacing:-5px;
  margin-bottom:27px;
}

h1 span,.accent { color:var(--green); }

.hero-description {
  color:var(--muted);
  max-width:590px;
  font-size:14px;
  line-height:2;
}

.hero-actions {
  display:flex;
  gap:13px;
  margin-top:32px;
  flex-wrap:wrap;
}

.btn {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:14px 21px;
  border-radius:7px;
  font-size:10px;
  font-weight:900;
  transition:.25s;
  cursor:pointer;
}

.btn-primary {
  background:var(--green);
  color:#10150c;
}

.btn-primary:hover {
  background:#d0ff9b;
  transform:translateY(-3px);
}

.btn-secondary {
  border:1px solid var(--border);
  color:var(--white);
}

.btn-secondary:hover { border-color:var(--green); }

.board-wrap {
  background:linear-gradient(145deg,#18231b,#0c110e);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.4);
  transform:rotate(2deg);
}

.board {
  display:grid;
  grid-template-columns:repeat(8,1fr);
  aspect-ratio:1;
  overflow:hidden;
  border-radius:5px;
}

.square {
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(20px,4vw,42px);
  line-height:1;
}

.light { background:#dce8c9; }
.dark { background:#6e8b5a; }

.board-caption {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:17px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:65px;
}

.stat {
  padding:20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:9px;
}

.stat strong {
  display:block;
  font-size:28px;
  color:var(--green);
  font-family:"Space Grotesk";
}

.stat span {
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

section { padding:105px 0; }

.dark-section {
  background:#0c100e;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.section-heading { margin-bottom:43px; }

.section-title {
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(31px,5vw,52px);
  line-height:1.17;
  letter-spacing:-2px;
  max-width:850px;
  margin-bottom:20px;
}

.section-description {
  color:var(--muted);
  max-width:760px;
  font-size:13px;
  line-height:1.9;
}

.grid-3 {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.grid-2 {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card {
  padding:27px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:11px;
  transition:.3s;
}

.card:hover {
  transform:translateY(-5px);
  border-color:rgba(183,243,107,.45);
}

.card-icon {
  font-size:25px;
  margin-bottom:18px;
}

.card h3 {
  font-family:"Space Grotesk",sans-serif;
  font-size:17px;
  margin-bottom:10px;
}

.card p {
  color:var(--muted);
  font-size:11px;
  line-height:1.95;
}

.language-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.language-card {
  background:var(--surface);
  border:1px solid var(--border);
  padding:17px;
  border-radius:8px;
  font-size:12px;
}

.language-card small {
  display:block;
  color:var(--muted);
  margin-top:4px;
}

.comparison {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.comparison-box {
  padding:32px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:11px;
}

.comparison-box.featured {
  border-color:var(--green);
  background:linear-gradient(145deg,#19241a,#101512);
}

.comparison-box h3 {
  font-size:24px;
  font-family:"Space Grotesk";
  margin-bottom:8px;
}

.comparison-box p {
  color:var(--muted);
  font-size:12px;
}

.feature-list {
  list-style:none;
  margin-top:22px;
}

.feature-list li {
  padding:9px 0;
  border-bottom:1px solid var(--border);
  font-size:11px;
  color:#c5cec6;
}

.feature-list li::before {
  content:"✓";
  color:var(--green);
  margin-right:10px;
}

body[dir="rtl"] .feature-list li::before {
  margin-right:0;
  margin-left:10px;
}

.calculator {
  background:linear-gradient(145deg,#18251a,#0e130f);
  border:1px solid var(--border);
  padding:30px;
  border-radius:12px;
  margin-top:28px;
}

.calculator label {
  color:var(--muted);
  font-size:11px;
}

.calculator input {
  display:block;
  width:100%;
  max-width:350px;
  margin:12px 0 22px;
  padding:13px;
  border-radius:7px;
  background:#080b09;
  color:var(--green);
  border:1px solid var(--border);
  font-size:20px;
  outline:none;
}

.calc-results {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.calc-item {
  background:rgba(0,0,0,.22);
  padding:18px;
  border-radius:8px;
}

.calc-item small {
  display:block;
  color:var(--muted);
  font-size:9px;
}

.calc-item strong {
  display:block;
  color:var(--green);
  font-size:24px;
  margin-top:8px;
}

.table-wrap {
  overflow-x:auto;
  margin-top:27px;
}

table {
  width:100%;
  border-collapse:collapse;
  min-width:540px;
}

th,td {
  padding:14px;
  text-align:start;
  border-bottom:1px solid var(--border);
  font-size:11px;
}

th {
  color:var(--green);
  background:var(--surface2);
}

td { color:#c3ccc4; }

.tag {
  display:inline-block;
  border:1px solid var(--border);
  padding:7px 10px;
  border-radius:5px;
  color:var(--green);
  font-size:9px;
  margin:4px;
}

.timeline {
  border-left:1px solid var(--green);
  margin-left:12px;
}

body[dir="rtl"] .timeline {
  border-left:none;
  border-right:1px solid var(--green);
  margin-left:0;
  margin-right:12px;
}

.phase {
  position:relative;
  padding:0 0 37px 34px;
}

body[dir="rtl"] .phase {
  padding:0 34px 37px 0;
}

.phase::before {
  content:"";
  position:absolute;
  left:-6px;
  top:8px;
  width:11px;
  height:11px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 15px var(--green);
}

body[dir="rtl"] .phase::before {
  left:auto;
  right:-6px;
}

.phase h3 {
  color:var(--green);
  font-family:"Space Grotesk";
  font-size:18px;
}

.phase p {
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

.phase ul {
  margin:12px 17px 0;
  color:#c4cec5;
  font-size:11px;
}

.phase li { padding:3px 0; }

.architecture {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.arch-item {
  background:var(--surface);
  padding:20px 12px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:8px;
}

.arch-item strong {
  display:block;
  color:var(--green);
  font-size:12px;
}

.arch-item small {
  color:var(--muted);
  font-size:9px;
}

.quote {
  padding:55px 25px;
  border:1px solid var(--border);
  background:linear-gradient(130deg,#18231a,#0c100d);
  border-radius:14px;
  text-align:center;
}

.quote h2 {
  font-family:"Space Grotesk";
  font-size:clamp(27px,5vw,47px);
  letter-spacing:-1px;
  line-height:1.3;
}

.quote h2 span { color:var(--green); }

.quote p {
  color:var(--muted);
  margin-top:17px;
  font-size:12px;
}

footer {
  padding:42px 0 25px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:10px;
}

.footer-inner {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.creator {
  margin-top:30px;
  padding-top:23px;
  border-top:1px solid var(--border);
  text-align:center;
}

.creator-label {
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.creator-name {
  display:block;
  color:var(--green);
  font-family:"Space Grotesk";
  font-weight:800;
  font-size:23px;
  letter-spacing:.3px;
  margin-top:5px;
}

.creator-role {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.mobile-panel {
  display:none;
  padding:10px 5%;
  background:#0d120f;
  border-top:1px solid var(--border);
}

.mobile-panel.open { display:grid; }

.mobile-panel a {
  color:var(--muted);
  padding:11px 0;
  font-size:12px;
  border-bottom:1px solid var(--border);
}

@media(max-width:1050px) {
  .nav-links { gap:12px; }
  .nav-links a { font-size:10px; }
}

@media(max-width:850px) {
  .hero-grid,.grid-2,.comparison { grid-template-columns:1fr; }
  .grid-3 { grid-template-columns:1fr 1fr; }
  .stats { grid-template-columns:1fr 1fr; }
  .language-grid { grid-template-columns:repeat(2,1fr); }
  .architecture { grid-template-columns:1fr 1fr; }
  .nav-links,.nav-button { display:none; }
  .mobile-menu { display:block; }
  .hero { padding-top:130px; }
}

@media(max-width:550px) {
  .grid-3 { grid-template-columns:1fr; }
  .calc-results { grid-template-columns:1fr; }
  .quote { padding:35px 17px; }
  h1 { letter-spacing:-2px; }
  .nav-inner { min-height:68px; }
  .logo { font-size:18px; }
  .language-select { max-width:112px; padding:9px 7px; }
  section { padding:78px 0; }
  .board-wrap { padding:12px; }
  .stats { gap:9px; }
  .stat { padding:14px; }
  .stat strong { font-size:23px; }
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<nav>
  <div class="nav-inner">
    <a href="#home" class="logo">CHESS<span>ARENA</span>.IO</a>

    <div class="nav-links">
      <a href="#vision" data-i18n="navVision"></a>
      <a href="#platform" data-i18n="navPlatform"></a>
      <a href="#competition" data-i18n="navCompetition"></a>
      <a href="#security" data-i18n="navSecurity"></a>
      <a href="#technology" data-i18n="navTechnology"></a>
      <a href="#roadmap" data-i18n="navRoadmap"></a>
    </div>

    <div class="nav-right">
      <select class="language-select" id="languageSelect" aria-label="Select language">
        <option value="az">🇦🇿 AZ</option>
        <option value="en">🇬🇧 EN</option>
        <option value="tr">🇹🇷 TR</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="ar">🇸🇦 AR</option>
        <option value="es">🇪🇸 ES</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
        <option value="pt">🇵🇹 PT</option>
        <option value="zh">🇨🇳 中文</option>
      </select>

      <a href="#vision" class="nav-button" data-i18n="navButton"></a>
      <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
    </div>
  </div>

  <div class="mobile-panel" id="mobilePanel">
    <a href="#vision" data-i18n="navVision"></a>
    <a href="#platform" data-i18n="navPlatform"></a>
    <a href="#competition" data-i18n="navCompetition"></a>
    <a href="#security" data-i18n="navSecurity"></a>
    <a href="#technology" data-i18n="navTechnology"></a>
    <a href="#roadmap" data-i18n="navRoadmap"></a>
  </div>
</nav>

<header class="hero" id="home">
<div class="container">

  <div class="hero-grid">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n-html="heroTitle"></h1>
      <p class="hero-description" data-i18n="heroDesc"></p>

      <div class="hero-actions">
        <a href="#vision" class="btn btn-primary" data-i18n="heroButton1"></a>
        <a href="#platform" class="btn btn-secondary" data-i18n="heroButton2"></a>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="chessboard"></div>
      <div class="board-caption">
        <span>CHESSARENA.IO</span>
        <span data-i18n="boardCaption"></span>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><strong>10</strong><span data-i18n="stat1"></span></div>
    <div class="stat"><strong>1%</strong><span data-i18n="stat2"></span></div>
    <div class="stat"><strong>2</strong><span data-i18n="stat3"></span></div>
    <div class="stat"><strong>GLOBAL</strong><span data-i18n="stat4"></span></div>
  </div>

</div>
</header>

<section id="vision">
<div class="container">
  <div class="section-heading">
    <div class="section-label" data-i18n="s1label"></div>
    <h2 class="section-title" data-i18n="s1title"></h2>
    <p class="section-description" data-i18n="s1desc"></p>
  </div>
  <div class="grid-3" id="visionCards"></div>
</div>
</section>

<section class="dark-section" id="platform">
<div class="container">
  <div class="section-heading">
    <div class="section-label" data-i18n="s2label"></div>
    <h2 class="section-title" data-i18n="s2title"></h2>
    <p class="section-description" data-i18n="s2desc"></p>
  </div>
  <div class="grid-3" id="platformCards"></div>
</div>
</section>

<section id="languages">
<div class="container">
  <div class="section-heading">
    <div class="section-label" data-i18n="s3label"></div>
    <h2 class="section-title" data-i18n="s3title"></h2>
    <p class="section-description" data-i18n="s3desc"></p>
  </div>
  <div class="language-grid" id="languageCards"></div>
</div>
</section>

<section class="dark-section" id="competition">
<div class="container">
  <div class="section-heading">
    <div class="section-label" data-i18n="s4label"></div>
    <h2 class="section-title" data-i18n="s4title"></h2>
    <p class="section-description" data-i18n="s4desc"></p>
  </div>

  <div class="comparison">
    <div class="comparison-box">
      <h3 data-i18n="freeTitle"></h3>
      <p data-i18n="freeDesc"></p>
      <ul class="feature-list" id="freeFeatures"></ul>
    </div>
    <div class="comparison-box featured">
      <h3 data-i18n="paidTitle"></h3>
      <p data-i18n="paidDesc"></p>
      <ul class="feature-list" id="paidFeatures"></ul>
    </div>
  </div>

  <div class="calculator">
    <div class="section-label" data-i18n="calcLabel"></div>
    <h3 style="font-size:22px;margin-bottom:18px" data-i18n="calcTitle"></h3>
    <label for="stake" data-i18n="calcInput"></label>
    <input type="number" id="stake" value="10" min="0" step="0.01">

    <div class="calc-results">
      <div class="calc-item">
        <small data-i18n="calcPool"></small>
        <strong id="pool">$20.00</strong>
      </div>
      <div class="calc-item">
        <small data-i18n="calcFee"></small>
        <strong id="fee">$0.20</strong>
      </div>
      <div class="calc-item">
        <small data-i18n="calcWinner"></small>
        <strong id="winner">$19.80</strong>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <p style="color:var(--muted);font-size:10px;margin-top:16px" data-i18n="calcNote"></p>
</div>
</section>

<section id="chess">
<div class="container">
  <div class="section-heading">
    <div class="section-label" data-i18n="s5label"></div>
    <h2 class="section-title" data-i18n="s5title"></h2>
    <p class="section-description" data-i18n="s5desc"></p>
  </div>
  <div class="grid-3" id="timeCards"></div>
  <div class="grid-2" style="margin-top:18px" id="gameCards"></div>
</div>
</section>

<section class="dark-section" id="security">
<div class="container">
  <div class="section-heading">
    <div class="section-label" data-i18n="s6label"></div>
    <h2 class="section-title" data-i18n="s6title"></h2>
    <p class="section-description" data-i18n="s6desc"></p>

const languageOptions = ["az","en","tr","ru","ar","es","fr","de","pt","zh"];

const flagLanguage = {
  az:"az",en:"en",tr:"tr",ru:"ru",ar:"ar",es:"es",fr:"fr",de:"de",pt:"pt",zh:"zh"
};

const card = (item) => `
  <article class="card">
    <div class="card-icon">${item[0]}</div>
    <h3>${item[1]}</h3>
    <p>${item[2]}</p>
  </article>
`;

const simpleCard = (item) => `
  <article class="card">
    <h3>${item[0]}</h3>
    <p>${item[1]}</p>
  </article>
`;

function renderList(id, items) {
  document.getElementById(id).innerHTML =
    items.map(x => `<li>${x}</li>`).join("");
}

function renderCards(id, items, simple=false) {
  document.getElementById(id).innerHTML =
    items.map(x => simple ? simpleCard(x) : card(x)).join("");
}

function renderLanguageCards(items) {
  document.getElementById("languageCards").innerHTML =
    items.map(x => `
      <div class="language-card">
        ${x[0]} ${x[1]}
        <small>${x[2]}</small>
      </div>
    `).join("");
}

function renderTags(id, items) {
  document.getElementById(id).innerHTML =
    items.map(x => `<span class="tag">${x}</span>`).join("");
}

function renderTable(t) {
  document.getElementById("tableHead").innerHTML =
    t.tableHead.map(x => `<th>${x}</th>`).join("");

  const stakes = [1,2,5,10,25,50,100];

  document.getElementById("tableBody").innerHTML =
    stakes.map(n => {
      const pool=n*2;
      const fee=pool*.01;
      const winner=pool*.99;
      return `<tr>
        <td>$${n.toFixed(2)}</td>
        <td>$${n.toFixed(2)}</td>
        <td>$${pool.toFixed(2)}</td>
        <td>$${fee.toFixed(2)}</td>
        <td>$${winner.toFixed(2)}</td>
      </tr>`;
    }).join("");
}

function renderRoadmap(items) {
  document.getElementById("roadmapItems").innerHTML =
    items.map(p => `
      <div class="phase">
        <h3>${p[0]}</h3>
        <p>${p[1]}</p>
        <ul>${p[2].map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
    `).join("");
}

function renderArchitecture(items) {
  document.getElementById("architecture").innerHTML =
    items.map(x => `
      <div class="arch-item">
        <strong>${x[0]}</strong>
        <small>${x[1]}</small>
      </div>
    `).join("");
}

function setText(language) {
  const t = languages[language] || languages.en;

  document.documentElement.lang = language === "zh" ? "zh-CN" : language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
  document.body.dir = language === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });

  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const key = el.dataset.i18nHtml;
    if (t[key] !== undefined) el.innerHTML = t[key];
  });

  renderCards("visionCards",t.visionCards);
  renderCards("platformCards",t.platformCards);
  renderLanguageCards(t.languageNames);
  renderList("freeFeatures",t.freeFeatures);
  renderList("paidFeatures",t.paidFeatures);
  renderTable(t);
  renderCards("timeCards",t.timeCards,true);

  document.getElementById("gameCards").innerHTML =
    t.gameCards.map(x => `
      <article class="card">
        <h3>${x[0]}</h3>
        <ul class="feature-list">${x[1].map(y=>`<li>${y}</li>`).join("")}</ul>
      </article>
    `).join("");

  renderCards("securityCards",t.securityCards.map((x,i)=>["🛡",x[0],x[1]]));
  document.getElementById("riskTags").innerHTML =
    t.riskTags.map(x=>`<span class="tag">${x}</span>`).join("");

  renderCards("socialCards",t.socialCards.map(x=>["✦",x[0],x[1]]));
  renderCards("tournamentCards",t.tournamentCards.map(x=>["🏆",x[0],x[1]]));
  renderCards("walletCards",t.walletCards.map(x=>["◇",x[0],x[1]]));
  renderArchitecture(t.architecture);
  renderCards("moduleCards",t.moduleCards.map(x=>["◈",x[0],x[1]]));
  renderCards("legalCards",t.legalCards.map(x=>["◉",x[0],x[1].join(" · ")]),true);
  renderRoadmap(t.roadmap);
  renderCards("businessCards",t.businessCards.map(x=>["◆",x[0],x[1]]));
  renderTags("kpiTags",t.kpis);
  renderCards("adminCards",t.adminCards.map(x=>["⚙",x[0],x[1]]));
  renderCards("principleCards",t.principleCards.map(x=>["◇",x[0],x[1]]));

  const select = document.getElementById("languageSelect");
  select.value = language;

  document.title = "ChessArena.io — " + t.name;

  document.getElementById("mobilePanel").classList.remove("open");
}

function detectLanguage() {
  const saved = localStorage.getItem("chessarena_language");

  if (saved && languages[saved]) return saved;

  const browser = (navigator.language || "en").toLowerCase();

  if (browser.startsWith("az")) return "az";
  if (browser.startsWith("tr")) return "tr";
  if (browser.startsWith("ru")) return "ru";
  if (browser.startsWith("ar")) return "ar";
  if (browser.startsWith("es")) return "es";
  if (browser.startsWith("fr")) return "fr";
  if (browser.startsWith("de")) return "de";
  if (browser.startsWith("pt")) return "pt";
  if (browser.startsWith("zh")) return "zh";

  return "en";
}

document.getElementById("languageSelect").addEventListener("change",e=>{
  const language = e.target.value;
  localStorage.setItem("chessarena_language",language);
  setText(language);
});

document.getElementById("mobileMenu").addEventListener("click",()=>{
  document.getElementById("mobilePanel").classList.toggle("open");
});

/* Interactive P2P calculator */

function calculate() {
  const stake = Math.max(0,Number(document.getElementById("stake").value)||0);
  const pool = stake*2;
  const fee = pool*.01;
  const winner = pool*.99;

  document.getElementById("pool").textContent="$"+pool.toFixed(2);
  document.getElementById("fee").textContent="$"+fee.toFixed(2);
  document.getElementById("winner").textContent="$"+winner.toFixed(2);
}

document.getElementById("stake").addEventListener("input",calculate);

/* Chessboard illustration */

const board = document.getElementById("chessboard");

const pieces = [
  "♜","♞","♝","♛","♚","♝","♞","♜",
  "♟","♟","♟","♟","♟","♟","♟","♟",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "♙","♙","♙","♙","♙","♙","♙","♙",
  "♖","♘","♗","♕","♔","♗","♘","♖"
];

pieces.forEach((piece,index)=>{
  const square=document.createElement("div");
  const row=Math.floor(index/8);
  const col=index%8;
  square.className="square "+((row+col)%2===0?"light":"dark");
  square.textContent=piece;
  board.appendChild(square);
});

/* Scroll progress */

window.addEventListener("scroll",()=>{
  const scrollTop=window.scrollY;
  const maxScroll=document.documentElement.scrollHeight-window.innerHeight;
  const progress=maxScroll>0?(scrollTop/maxScroll)*100:0;
  document.getElementById("progress").style.width=progress+"%";
});

/* Initialize */

const initialLanguage=detectLanguage();
setText(initialLanguage);
calculate();
</script>
